services:
  postgres:
    image: postgres:16-alpine
    container_name: pangtao_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pangtao_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The production image with its database (C-03). Opt-in, so `docker compose up -d`
  # still starts only PostgreSQL for local development and tests:
  #   docker compose --profile app up -d --build
  #
  # One-off job, same as the Cloud Run migration job: apply migrations, then seed.
  migrate:
    profiles: ["app"]
    build: .
    image: pangtao:local
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment: &container-env
      NODE_ENV: production
      # Inside the compose network the database host is the service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pangtao_db}
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]

  app:
    profiles: ["app"]
    image: pangtao:local
    container_name: pangtao_app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment: *container-env
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
